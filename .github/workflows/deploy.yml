name: Verificações e GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar-e-construir:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Base real do repositório (nome: capi); build e artefato usam a mesma.
      VITE_BASE_PATH: /capi/
      VITE_PONTE_APPLE_PAY_URL: ${{ vars.VITE_PONTE_APPLE_PAY_URL }}
      VITE_VAPID_CHAVE_PUBLICA: ${{ vars.VITE_VAPID_CHAVE_PUBLICA }}
    permissions:
      contents: read
      pages: read
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preparar Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependências fixadas
        run: npm ci
      - name: Verificar dependências de produção conhecidas
        # Só o que vai para o app. As 4 falhas moderadas de glob/minimatch ficam só nas ferramentas de build (vite-plugin-pwa).
        run: npm audit --omit=dev --audit-level=moderate
      - name: Testar
        run: npm run test
      - name: Construir
        run: npm run build
      - name: Preparar páginas diretas (GitHub Pages devolve 404.html para /capi/atalho e /capi/lancar)
        run: cp dist/index.html dist/404.html
      - name: Preparar GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PUBLICAR_PAGES == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Enviar somente dist
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PUBLICAR_PAGES == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  verificar-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preparar Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: servidor/package-lock.json
      - name: Instalar dependências do Worker
        run: npm --prefix servidor ci
      - name: Testar o Worker
        run: npm --prefix servidor run test
      - name: Construir o Worker
        run: npm --prefix servidor run build

  publicar:
    # Trava: só publica com a variável de repositório PUBLICAR_PAGES = 'true'.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PUBLICAR_PAGES == 'true'
    needs: [verificar-e-construir, verificar-worker]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar artefato verificado
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
