<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Capi · Posso comprar?</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""><link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.t-claro{--bg:#F1F3F7;--sf:#FFFFFF;--sf2:#EEF1F6;--tx:#0D1730;--tx2:#454F64;--tx3:#535E74;--ln:#E6EAF1;--hero1:#1E2E57;--hero2:#0B1530;--herotx:#FFFFFF;--herotx2:#AFBCD8;--ice1:#E3ECFC;--ice2:#CCDCF7;--icetx:#0D1730;--bl:#2E5BDB;--bl2:#7F9EEA;--blsf:#E6EDFC;--ok:#147A4C;--oksf:#E2F4EA;--warn:#94600A;--warnsf:#FBF0DA;--bad:#9E302A;--badsf:#FBE6E3;--scrim:rgba(13,23,48,.38);--sh:0 1px 2px rgba(13,23,48,.04),0 10px 28px rgba(13,23,48,.07);--glass:rgba(255,255,255,.78)}
.t-escuro{--bg:#080C17;--sf:#121A2C;--sf2:#1A2338;--tx:#EEF2FA;--tx2:#9CA8C0;--tx3:#8792AA;--ln:#212B42;--hero1:#2A3E74;--hero2:#121D3E;--herotx:#FFFFFF;--herotx2:#B4C2E2;--ice1:#1C2B4F;--ice2:#16223F;--icetx:#EEF2FA;--bl:#8FAAFF;--bl2:#5B7BD8;--blsf:#1B2848;--ok:#5FD69A;--oksf:#10291F;--warn:#F0C25C;--warnsf:#33280F;--bad:#FF8C80;--badsf:#371917;--scrim:rgba(0,0,0,.55);--sh:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);--glass:rgba(18,26,44,.78)}
.num{font-variant-numeric:tabular-nums;letter-spacing:-0.025em}
a{color:var(--bl);text-decoration:none}a:hover{text-decoration:underline}
button{font-family:inherit;cursor:pointer}
button:active,a:active{transform:scale(.97)}
input,textarea{font-family:inherit}
</style>
</helmet>
<div class="{{temaClass}}" style="width: 390px; height: 900px; box-sizing: border-box; position: relative; overflow: hidden; background: var(--bg); color: var(--tx); font-family: -apple-system, &quot;SF Pro Text&quot;, Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased">

<div style="position: absolute; left: 0; right: 0; top: 0; height: 250px; background: linear-gradient(165deg, var(--hero1), var(--hero2)); color: #FFFFFF"><div style="display: flex; justify-content: space-between; padding: 58px 20px 0"><a href="Home.dc.html" aria-label="Voltar" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: rgba(255,255,255,.14); color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a></div><h1 style="margin: 18px 24px 0; font-size: 28px; line-height: 1.12; font-weight: 600; letter-spacing: -0.025em">Posso<br/><span style="color: #A9C2FA">comprar?</span></h1></div>
<div style="position: absolute; left: 0; right: 0; top: 210px; bottom: 0; border-radius: 30px 30px 0 0; background: var(--bg); padding: 18px 16px 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px">
<div style="padding: 18px; border-radius: 26px; background: var(--sf); box-shadow: var(--sh); "><label for="item" style="font-size: 12px; color: var(--tx2)">O que é</label><input id="item" value="Tênis de corrida" readonly="" style="display: block; width: 100%; box-sizing: border-box; margin-top: 2px; border: none; background: transparent; color: var(--tx); font-size: 17px; font-weight: 600; padding: 0; outline: none"/>
<div style="height: 1px; background: var(--ln); margin: 12px 0"></div>
<label for="preco" style="font-size: 12px; color: var(--tx2)">Preço</label><input id="preco" class="num" value="R$ 480,00" readonly="" style="display: block; width: 100%; box-sizing: border-box; margin-top: 2px; border: none; background: transparent; color: var(--tx); font-size: 34px; font-weight: 600; padding: 0; outline: none"/>
<div style="display: flex; gap: 4px; margin-top: 12px; padding: 4px; border-radius: 22px; background: var(--sf2)"><sc-for list="{{parc}}" as="p" hint-placeholder-count="4"><button type="button" onClick="{{p.pick}}" class="num" style="{{p.style}}">{{p.label}}</button></sc-for></div></div>
<section style="padding: 18px; border-radius: 26px; background: {{vbg}}"><div style="display: flex; align-items: center; gap: 10px"><span style="width: 10px; height: 10px; border-radius: 5px; background: {{vcor}}"></span><span style="font-size: 13px; font-weight: 600; color: {{vcor}}">{{vtag}}</span></div><div style="font-size: 19px; font-weight: 600; line-height: 1.25; margin-top: 6px; letter-spacing: -0.01em">{{vtitulo}}</div>
<div style="display: flex; flex-direction: column; gap: 10px; font-size: 14px; margin-top: 14px"><div style="display: flex; justify-content: space-between"><span style="color: var(--tx2)">Compras online</span><b class="num" style="font-weight: 600">{{teto}}</b></div><div style="display: flex; justify-content: space-between"><span style="color: var(--tx2)">Fatura de janeiro</span><b class="num" style="font-weight: 600">{{fat}}</b></div><div style="display: flex; justify-content: space-between"><span style="color: var(--tx2)">Viagem out/2027</span><b style="font-weight: 600">{{viagem}}</b></div></div></section>
</div>
<div style="position: absolute; left: 16px; right: 16px; bottom: 26px; display: flex; flex-direction: column; gap: 10px"><a href="Home.dc.html" style="height: 64px; padding: 0 12px 0 22px; border-radius: 32px; background: var(--hero2); color: #FFFFFF; font-weight: 600; font-size: 16px; display: flex; align-items: center; justify-content: space-between; text-decoration: none">Esperar 24 h e decidir<span style="width: 40px; height: 40px; border-radius: 20px; background: #FFFFFF; color: #0D1730; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span></a><a href="Lancar.dc.html" style="height: 64px; padding: 0 12px 0 22px; border-radius: 32px; background: var(--sf); color: var(--tx); box-shadow: var(--sh); font-weight: 600; font-size: 16px; display: flex; align-items: center; justify-content: center; text-decoration: none">Comprar mesmo assim</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tema": {"editor": "enum", "options": ["claro", "escuro"], "default": "claro"}, "$preview": {"width": 390, "height": 900}}'>
class Component extends DCLogic {
  constructor(props){ super(props); this.state = { n: 1 }; }

  renderVals() {
    const tema = this.props.tema ?? 'claro';
    const temaClass = tema === 'escuro' ? 't-escuro' : 't-claro';
    const opts=[1,2,3,6]; const n=this.state.n; const preco=480; const mes=Math.round(preco/n); const usado=290; const teto=400; const novo=usado+mes;
    const base='height: 40px; flex: 1; border-radius: 20px; border: none; font-weight: 600; font-size: 14px; ';
    const parc=opts.map(o=>({label:o===1?'À vista':o+'x',pick:()=>this.setState({n:o}),style:base+(o===n?'background: var(--sf); color: var(--tx); box-shadow: 0 1px 4px rgba(0,0,0,.12)':'background: transparent; color: var(--tx2)')}));
    const fmt=v=>'R$ '+v.toLocaleString('pt-BR'); const estoura=novo>teto; const semanas=Math.max(1,Math.round(preco/545*4.3/(n>2?2:1)));
    const vv = { parc, teto: fmt(usado)+' → '+fmt(novo), fat: fmt(1640)+' → '+fmt(1640+mes), viagem: 'atrasa ~'+semanas+(semanas>1?' semanas':' semana'),
      vtag: estoura?'Passa do teto em '+fmt(novo-teto):'Cabe no teto', vcor: estoura?'var(--bad)':'var(--ok)', vbg: estoura?'var(--badsf)':'var(--oksf)',
      vtitulo: estoura?'Estoura Compras online e atrasa a viagem.':'Cabe, mas a viagem atrasa um pouco.' };
    return { temaClass, ...vv };
  }
}
</script>
</body>
</html>
