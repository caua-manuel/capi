<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Capi · Lançar gasto</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""><link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.t-claro{--bg:#F1F3F7;--sf:#FFFFFF;--sf2:#EEF1F6;--tx:#0D1730;--tx2:#454F64;--tx3:#535E74;--ln:#E6EAF1;--hero1:#1E2E57;--hero2:#0B1530;--herotx:#FFFFFF;--herotx2:#AFBCD8;--ice1:#E3ECFC;--ice2:#CCDCF7;--icetx:#0D1730;--bl:#2E5BDB;--bl2:#7F9EEA;--blsf:#E6EDFC;--ok:#147A4C;--oksf:#E2F4EA;--warn:#94600A;--warnsf:#FBF0DA;--bad:#9E302A;--badsf:#FBE6E3;--scrim:rgba(13,23,48,.38);--sh:0 1px 2px rgba(13,23,48,.04),0 10px 28px rgba(13,23,48,.07);--glass:rgba(255,255,255,.78)}
.t-escuro{--bg:#080C17;--sf:#121A2C;--sf2:#1A2338;--tx:#EEF2FA;--tx2:#9CA8C0;--tx3:#8792AA;--ln:#212B42;--hero1:#2A3E74;--hero2:#121D3E;--herotx:#FFFFFF;--herotx2:#B4C2E2;--ice1:#1C2B4F;--ice2:#16223F;--icetx:#EEF2FA;--bl:#8FAAFF;--bl2:#5B7BD8;--blsf:#1B2848;--ok:#5FD69A;--oksf:#10291F;--warn:#F0C25C;--warnsf:#33280F;--bad:#FF8C80;--badsf:#371917;--scrim:rgba(0,0,0,.55);--sh:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);--glass:rgba(18,26,44,.78)}
.num{font-variant-numeric:tabular-nums;letter-spacing:-0.025em}
a{color:var(--bl);text-decoration:none}a:hover{text-decoration:underline}
button{font-family:inherit;cursor:pointer}
button:active,a:active{transform:scale(.97)}
input,textarea{font-family:inherit}
</style>
</helmet>
<div class="{{temaClass}}" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: var(--bg); color: var(--tx); font-family: -apple-system, &quot;SF Pro Text&quot;, Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased">

<div aria-hidden="true" style="position: absolute; inset: 0; padding: 120px 16px; display: flex; flex-direction: column; gap: 12px"><div style="height: 190px; border-radius: 28px; background: linear-gradient(160deg, var(--hero1), var(--hero2))"></div><div style="height: 150px; border-radius: 26px; background: var(--ice1)"></div></div>
<div style="position: absolute; inset: 0; background: var(--scrim); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px)"></div>
<section aria-label="Novo gasto" style="position: absolute; left: 8px; right: 8px; bottom: 8px; padding: 10px 18px 22px; border-radius: 38px; background: var(--sf); box-shadow: 0 -10px 40px rgba(0,0,0,.18); display: flex; flex-direction: column; gap: 16px">
<div style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: var(--ln)"></div>
<div style="display: flex; justify-content: space-between; align-items: center"><a href="Home.dc.html" style="font-weight: 500; font-size: 16px; width: 70px">Cancelar</a><span style="font-size: 17px; font-weight: 600">Novo gasto</span><span style="width: 70px"></span></div>
<sc-if value="{{applepay}}" hint-placeholder-val="{{ false }}"><span style="align-self: center; display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 14px; background: var(--oksf); color: var(--ok); font-weight: 600; font-size: 12px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>Preenchido pelo Apple Pay</span></sc-if>
<div style="text-align: center; padding: 0"><div style="display: flex; justify-content: center; margin-bottom: 4px"><img src="../capi/capi-joinha.png" alt="" style="height: 92px; width: auto; display: block; "/></div><div class="num" style="font-size: 56px; font-weight: 600; letter-spacing: -0.04em; line-height: 1">R$ 42<span style="color: var(--tx3)">,00</span></div><div style="margin-top: 8px; font-size: 15px; color: var(--tx2)">iFood · hoje, 20:14</div></div>
<label for="texto" style="position: absolute; left: -9999px">Escreva o gasto</label>
<div style="height: 52px; padding: 0 16px; border-radius: 26px; background: var(--sf2); display: flex; align-items: center; gap: 10px"><span style="color: var(--tx3)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/></svg></span><input id="texto" value="{{texto}}" readonly="" style="flex: 1; border: none; outline: none; background: transparent; color: var(--tx); font-size: 17px; padding: 0"/><span style="color: var(--bl); font-size: 13px; font-weight: 600">entendi</span></div>
<div style="display: flex; flex-direction: column; gap: 10px"><span style="font-size: 13px; color: var(--tx2); padding: 0 4px">Categoria</span><div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{cats}}" as="c" hint-placeholder-count="6"><button type="button" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button></sc-for><button type="button" style="height: 44px; padding: 0 16px; border-radius: 22px; border: 1.5px dashed var(--bl2); background: transparent; color: var(--bl); font-weight: 600; font-size: 14px">+ Nova categoria</button></div></div>
<div style="padding: 12px 14px; border-radius: 18px; background: var(--warnsf); font-size: 13px; color: var(--tx)">Delivery vai para <b class="num">R$ 362</b> de <b class="num">R$ 400</b> este mês.</div>
<a href="Home.dc.html" style="height: 64px; padding: 0 12px 0 22px; border-radius: 32px; background: var(--hero2); color: #FFFFFF; font-weight: 600; font-size: 16px; display: flex; align-items: center; justify-content: space-between; text-decoration: none">Salvar gasto<span style="width: 40px; height: 40px; border-radius: 20px; background: #FFFFFF; color: #0D1730; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></span></a>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tema": {"editor": "enum", "options": ["claro", "escuro"], "default": "claro"}, "$preview": {"width": 390, "height": 844}, "origem": {"editor": "enum", "options": ["manual", "applepay"], "default": "manual"}}'>
class Component extends DCLogic {
  constructor(props){ super(props); this.state = { cat: 'Delivery' }; }

  renderVals() {
    const tema = this.props.tema ?? 'claro';
    const temaClass = tema === 'escuro' ? 't-escuro' : 't-claro';
    const names=['Delivery','Comida fora','Mercado','Lazer','Compras online','Outros']; const sel=this.state.cat;
    const base='height: 44px; padding: 0 16px; border-radius: 22px; border: none; font-weight: 500; font-size: 14px; ';
    const cats=names.map(n=>({label:n,pick:()=>this.setState({cat:n}),style:base+(n===sel?'background: var(--hero2); color: #FFFFFF':'background: var(--sf2); color: var(--tx)')}));
    const ap=(this.props.origem ?? 'manual')==='applepay';
    const vv = { cats, applepay: ap, texto: ap ? 'iFood 42,00' : 'ifood 42' };
    return { temaClass, ...vv };
  }
}
</script>
</body>
</html>
