<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Capi · Onboarding</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""><link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.t-claro{--bg:#F1F3F7;--sf:#FFFFFF;--sf2:#EEF1F6;--tx:#0D1730;--tx2:#454F64;--tx3:#535E74;--ln:#E6EAF1;--hero1:#1E2E57;--hero2:#0B1530;--herotx:#FFFFFF;--herotx2:#AFBCD8;--ice1:#E3ECFC;--ice2:#CCDCF7;--icetx:#0D1730;--bl:#2E5BDB;--bl2:#7F9EEA;--blsf:#E6EDFC;--ok:#147A4C;--oksf:#E2F4EA;--warn:#94600A;--warnsf:#FBF0DA;--bad:#9E302A;--badsf:#FBE6E3;--scrim:rgba(13,23,48,.38);--sh:0 1px 2px rgba(13,23,48,.04),0 10px 28px rgba(13,23,48,.07);--glass:rgba(255,255,255,.78)}
.t-escuro{--bg:#080C17;--sf:#121A2C;--sf2:#1A2338;--tx:#EEF2FA;--tx2:#9CA8C0;--tx3:#8792AA;--ln:#212B42;--hero1:#2A3E74;--hero2:#121D3E;--herotx:#FFFFFF;--herotx2:#B4C2E2;--ice1:#1C2B4F;--ice2:#16223F;--icetx:#EEF2FA;--bl:#8FAAFF;--bl2:#5B7BD8;--blsf:#1B2848;--ok:#5FD69A;--oksf:#10291F;--warn:#F0C25C;--warnsf:#33280F;--bad:#FF8C80;--badsf:#371917;--scrim:rgba(0,0,0,.55);--sh:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);--glass:rgba(18,26,44,.78)}
.num{font-variant-numeric:tabular-nums;letter-spacing:-0.025em}
a{color:var(--bl);text-decoration:none}a:hover{text-decoration:underline}
button{font-family:inherit;cursor:pointer}
button:active,a:active{transform:scale(.97)}
input,textarea{font-family:inherit}
</style>
</helmet>
<div class="{{temaClass}}" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: var(--bg); color: var(--tx); font-family: -apple-system, &quot;SF Pro Text&quot;, Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased">

<header style="display: flex; align-items: center; justify-content: space-between; padding: 58px 20px 6px"><a href="Main.dc.html" aria-label="Voltar" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: var(--sf); color: var(--tx); box-shadow: var(--sh); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a><span style="font-weight: 600; font-size: 17px; letter-spacing: -0.01em">Renda</span><span class="num" style="width: 44px; text-align: right; font-weight: 600; color: var(--tx2); font-size: 14px">1/8</span></header>
<div style="padding: 6px 24px 0; display: flex; gap: 6px"><div style="flex: 1; height: 4px; border-radius: 2px; background: var(--bl)"></div><sc-for list="{{rest}}" as="r" hint-placeholder-count="7"><div style="flex: 1; height: 4px; border-radius: 2px; background: var(--ln)"></div></sc-for></div>
<div style="position: absolute; right: 12px; top: 120px"><img src="../capi/capi-caderno.png" alt="" style="height: 118px; width: auto; display: block; "/></div><div style="padding: 34px 130px 0 24px"><h1 style="margin: 0; font-size: 30px; line-height: 1.12; letter-spacing: -0.025em; font-weight: 600">Quanto cai na sua conta<br/><span style="color: var(--tx2)">por mês, líquido?</span></h1></div>
<div style="margin: 26px 16px 0"><div style="padding: 18px; border-radius: 26px; background: var(--sf); box-shadow: var(--sh); "><label for="renda" style="font-size: 13px; color: var(--tx2); font-weight: 500">Valor mensal</label>
<div style="display: flex; align-items: baseline; gap: 6px; margin-top: 4px"><span class="num" style="font-size: 24px; color: var(--tx3); font-weight: 500">R$</span><input id="renda" class="num" value="{{valor}}" readonly="" style="border: none; outline: none; background: transparent; color: var(--tx); font-size: 48px; font-weight: 600; width: 100%; padding: 0"/></div></div></div>
<div style="padding: 14px 16px 0; display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{chips}}" as="c" hint-placeholder-count="5"><button type="button" onClick="{{c.pick}}" class="num" style="{{c.style}}">{{c.label}}</button></sc-for></div>
<div style="padding: 10px 24px 0"><button type="button" style="border: none; background: none; padding: 10px 0; color: var(--bl); font-weight: 600; font-size: 15px">Não sei, quero estimar</button></div>
<div style="position: absolute; left: 16px; right: 16px; bottom: 34px; display: flex; flex-direction: column; gap: 14px">
<p style="margin: 0 8px; color: var(--tx2); font-size: 13px; text-align: center">É a base dos seus tetos, metas e de quanto dá para guardar.</p>
<a href="Diagnostico.dc.html" style="height: 64px; padding: 0 12px 0 22px; border-radius: 32px; background: var(--hero2); color: #FFFFFF; font-weight: 600; font-size: 16px; display: flex; align-items: center; justify-content: space-between; text-decoration: none">Continuar<span style="width: 40px; height: 40px; border-radius: 20px; background: #FFFFFF; color: #0D1730; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tema": {"editor": "enum", "options": ["claro", "escuro"], "default": "claro"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  constructor(props){ super(props); this.state = { sel: '3.200' }; }

  renderVals() {
    const tema = this.props.tema ?? 'claro';
    const temaClass = tema === 'escuro' ? 't-escuro' : 't-claro';
    const vals=['1.500','2.500','3.200','4.000','6.000']; const sel=this.state.sel;
    const base='height: 44px; padding: 0 18px; border-radius: 22px; border: none; font-weight: 600; font-size: 15px; ';
    const chips=vals.map(v=>({label:'R$ '+v,pick:()=>this.setState({sel:v}),style:base+(v===sel?'background: var(--hero2); color: #FFFFFF':'background: var(--sf); color: var(--tx); box-shadow: var(--sh)')}));
    const vv = { chips, valor: sel+',00', rest:[1,2,3,4,5,6,7] };
    return { temaClass, ...vv };
  }
}
</script>
</body>
</html>
