<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Capi · Check-in semanal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""><link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.t-claro{--bg:#F1F3F7;--sf:#FFFFFF;--sf2:#EEF1F6;--tx:#0D1730;--tx2:#454F64;--tx3:#535E74;--ln:#E6EAF1;--hero1:#1E2E57;--hero2:#0B1530;--herotx:#FFFFFF;--herotx2:#AFBCD8;--ice1:#E3ECFC;--ice2:#CCDCF7;--icetx:#0D1730;--bl:#2E5BDB;--bl2:#7F9EEA;--blsf:#E6EDFC;--ok:#147A4C;--oksf:#E2F4EA;--warn:#94600A;--warnsf:#FBF0DA;--bad:#9E302A;--badsf:#FBE6E3;--scrim:rgba(13,23,48,.38);--sh:0 1px 2px rgba(13,23,48,.04),0 10px 28px rgba(13,23,48,.07);--glass:rgba(255,255,255,.78)}
.t-escuro{--bg:#080C17;--sf:#121A2C;--sf2:#1A2338;--tx:#EEF2FA;--tx2:#9CA8C0;--tx3:#8792AA;--ln:#212B42;--hero1:#2A3E74;--hero2:#121D3E;--herotx:#FFFFFF;--herotx2:#B4C2E2;--ice1:#1C2B4F;--ice2:#16223F;--icetx:#EEF2FA;--bl:#8FAAFF;--bl2:#5B7BD8;--blsf:#1B2848;--ok:#5FD69A;--oksf:#10291F;--warn:#F0C25C;--warnsf:#33280F;--bad:#FF8C80;--badsf:#371917;--scrim:rgba(0,0,0,.55);--sh:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);--glass:rgba(18,26,44,.78)}
.num{font-variant-numeric:tabular-nums;letter-spacing:-0.025em}
a{color:var(--bl);text-decoration:none}a:hover{text-decoration:underline}
button{font-family:inherit;cursor:pointer}
button:active,a:active{transform:scale(.97)}
input,textarea{font-family:inherit}
</style>
</helmet>
<div class="{{temaClass}}" style="width: 390px; height: 960px; box-sizing: border-box; position: relative; overflow: hidden; background: var(--bg); color: var(--tx); font-family: -apple-system, &quot;SF Pro Text&quot;, Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased">

<div style="position: absolute; left: 0; right: 0; top: 0; height: 330px; background: linear-gradient(165deg, var(--hero1), var(--hero2)); color: #FFFFFF"><div style="display: flex; justify-content: space-between; padding: 58px 20px 0"><a href="Home.dc.html" aria-label="Voltar" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: rgba(255,255,255,.14); color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a></div><h1 style="margin: 18px 24px 0; font-size: 28px; line-height: 1.12; font-weight: 600; letter-spacing: -0.025em">Check-in<br/><span style="color: #A9C2FA">da semana 2</span></h1><div style="position: absolute; right: 6px; bottom: 30px"><img src="../capi/capi-cha.png" alt="" style="height: 150px; width: auto; display: block; "/></div><div style="margin: 18px 24px 0"><div style="font-size: 13px; color: var(--herotx2)">Pode gastar até domingo</div><div class="num" style="font-size: 42px; font-weight: 600; letter-spacing: -0.035em">R$ 310</div><div style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #A9C2FA; font-weight: 600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-3 2-4 2-6 2 1 3 2 3 4"/></svg>3 semanas seguidas no plano</div></div></div>
<div style="position: absolute; left: 0; right: 0; top: 300px; bottom: 0; border-radius: 30px 30px 0 0; background: var(--bg); padding: 18px 16px 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px">
<div style="padding: 18px; border-radius: 26px; background: var(--sf); box-shadow: var(--sh); "><div style="font-weight: 600; padding-bottom: 4px">Livre por categoria</div><sc-for list="{{cats}}" as="c" hint-placeholder-count="4"><div style="display: flex; flex-direction: column; gap: 6px; padding: 10px 0"><div style="display: flex; justify-content: space-between; font-size: 14px"><span style="font-weight: 500">{{c.nome}}</span><span class="num" style="font-weight: 600">{{c.livre}}</span></div><div style="height: 5px; border-radius: 3px; background: var(--sf2); overflow: hidden"><div style="{{c.barra}}"></div></div></div></sc-for></div>
<div style="padding: 18px; border-radius: 26px; background: var(--sf); box-shadow: var(--sh); "><div style="font-weight: 600">2 gastos do Apple Pay sem categoria</div>
<div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 0 8px"><span style="font-size: 14px">Posto Ipiranga · <b class="num" style="font-weight: 600">R$ 80</b></span><button type="button" style="height: 44px; padding: 0 16px; border-radius: 22px; border: none; background: var(--hero2); color: #FFFFFF; font-weight: 500">Combustível</button></div>
<div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 0 0; border-top: 1px solid var(--ln)"><span style="font-size: 14px">Padaria Real · <b class="num" style="font-weight: 600">R$ 23</b></span><button type="button" style="height: 44px; padding: 0 16px; border-radius: 22px; border: none; background: var(--hero2); color: #FFFFFF; font-weight: 500">Comida fora</button></div></div>
</div>
<div style="position: absolute; left: 16px; right: 16px; bottom: 26px"><a href="Home.dc.html" style="height: 64px; padding: 0 12px 0 22px; border-radius: 32px; background: var(--hero2); color: #FFFFFF; font-weight: 600; font-size: 16px; display: flex; align-items: center; justify-content: space-between; text-decoration: none">Fechar check-in<span style="width: 40px; height: 40px; border-radius: 20px; background: #FFFFFF; color: #0D1730; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></span></a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tema": {"editor": "enum", "options": ["claro", "escuro"], "default": "claro"}, "$preview": {"width": 390, "height": 960}}'>
class Component extends DCLogic {

  renderVals() {
    const tema = this.props.tema ?? 'claro';
    const temaClass = tema === 'escuro' ? 't-escuro' : 't-claro';
    const raw=[['Delivery',38,48],['Comida fora',60,33],['Uber e 99',12,76],['Mercado',140,7]];
    const cats=raw.map(([n,l,u])=>({nome:n,livre:'R$ '+l,barra:'width: '+u+'%; height: 100%; border-radius: 3px; background: '+(u>=75?'var(--warn)':'var(--bl)')}));
    const vv = { cats };
    return { temaClass, ...vv };
  }
}
</script>
</body>
</html>
